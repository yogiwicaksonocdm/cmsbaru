<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda | Node.js CMS</title>
    <meta name="description" content="Homepage publik dari Node.js CMS berbasis Firestore">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes heroWordIn {
            from { opacity: 0; transform: translateY(1.4rem); }
            to { opacity: 1; transform: translateY(0); }
        }
        .hero-word {
            display: inline-block;
            opacity: 0;
            animation: heroWordIn 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes heroFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.5rem); }
        }
        .hero-caption { animation: heroFloat 7s ease-in-out infinite; }

        @keyframes heroCursorBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .hero-cursor {
            display: inline-block;
            width: 2px;
            height: 1em;
            margin-left: 2px;
            vertical-align: -0.12em;
            background: currentColor;
            animation: heroCursorBlink 0.9s step-end infinite;
        }

        @keyframes heroGlow {
            0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.45; }
            50% { transform: translate(3rem, 2rem) scale(1.15); opacity: 0.8; }
        }
        .hero-glow { animation: heroGlow 12s ease-in-out infinite; }

        .page-break {
            position: relative;
            margin: 2rem 0;
            border: 0;
            height: 1px;
            background: linear-gradient(to right, transparent, #cbd5e1, transparent);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .page-break::before {
            content: "Page Break";
            position: absolute;
            background: white;
            color: #64748b;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            padding: 0 0.75rem;
        }

        .read-more-toggle {
            margin-top: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #eff6ff;
            color: #1d4ed8;
            border: 1px solid #bfdbfe;
            border-radius: 9999px;
            padding: 0.5rem 0.9rem;
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .read-more-toggle:hover {
            background: #dbeafe;
        }
        .read-more-content.hidden {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .hero-word { animation: none; opacity: 1; transform: none; }
            .hero-caption, .hero-glow, .hero-cursor { animation: none; }
        }
    </style>
</head>
<body class="bg-gray-50 font-sans leading-relaxed tracking-normal text-gray-800">
    <header class="bg-white/90 backdrop-blur border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-6 py-4 max-w-4xl flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="bg-blue-600 text-white font-bold rounded-lg w-9 h-9 flex items-center justify-center">C</span>
                <span class="text-lg font-bold text-gray-800">CMS Publik</span>
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="/" class="text-blue-600 font-semibold">Beranda</a>
                <a href="/admin" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg transition">Masuk Admin</a>
            </nav>
        </div>
    </header>

    <section class="relative overflow-hidden text-white bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700">
        <div id="heroBg" class="absolute inset-0 bg-cover bg-center hidden"></div>
        <div id="heroOverlay" class="absolute inset-0 bg-gradient-to-r from-black/75 via-black/55 to-black/30 hidden"></div>
        <div class="absolute -top-24 -left-24 w-96 h-96 bg-white/10 rounded-full blur-3xl hero-glow"></div>
        <div class="relative container mx-auto px-6 py-24 md:py-40 max-w-4xl min-h-[55vh] flex flex-col justify-center">
            <div class="hero-caption">
                <h1 id="heroTitle" class="text-4xl sm:text-5xl lg:text-6xl font-bold leading-tight">Selamat Datang di CMS Kami</h1>
                <p id="heroSubtitle" class="mt-5 text-blue-100 text-lg md:text-2xl max-w-2xl min-h-[3.75rem]">
                    Baca semua konten yang sudah diterbitkan oleh tim admin. Konten diperbarui secara langsung dari Firestore.
                </p>
            </div>
            <div class="mt-10 flex items-center gap-6 text-sm text-blue-100">
                <span><span id="postCount" class="text-white font-bold text-xl">–</span> konten terbit</span>
                <span class="hidden sm:inline">Diperbarui: <span id="lastUpdated">–</span></span>
            </div>
        </div>
    </section>

    <main class="container mx-auto px-6 py-10 max-w-4xl">
        <div class="flex items-center justify-between flex-wrap gap-3 mb-6">
            <h2 class="text-2xl font-bold text-gray-800">Konten Terbaru</h2>
            <select id="categoryFilter" aria-label="Filter kategori" class="hidden px-3 py-2 border rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <option value="">Semua kategori</option>
            </select>
        </div>

        <div id="statusBox" class="hidden mb-6 rounded-lg border px-4 py-3 text-sm"></div>

        <div id="postsList" class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-200 bg-white">
        <div class="container mx-auto px-6 py-6 max-w-4xl text-sm text-gray-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>&copy; <span id="year"></span> Node.js CMS &middot; Firestore</p>
            <p>Punya konten untuk diterbitkan? <a href="/admin" class="text-blue-600 font-semibold hover:underline">Masuk dashboard admin</a></p>
        </div>
    </footer>

    <script>
        const postsList = document.getElementById('postsList');
        const statusBox = document.getElementById('statusBox');
        document.getElementById('year').textContent = new Date().getFullYear();

        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            const date = new Date(value);
            return isNaN(date) ? '–' : date.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function showStatus(type, message) {
            const styles = {
                info: 'bg-blue-50 border-blue-200 text-blue-700',
                error: 'bg-red-50 border-red-200 text-red-700',
            };
            statusBox.className = `mb-6 rounded-lg border px-4 py-3 text-sm ${styles[type] || styles.info}`;
            statusBox.textContent = message;
            statusBox.classList.remove('hidden');
        }

        function renderContentBlock(text) {
            const normalized = String(text ?? '').replace(/\r\n/g, '\n').trim();
            if (!normalized) return '';
            return escapeHtml(normalized).replace(/\n/g, '<br>');
        }

        function splitByPageBreak(content) {
            const raw = String(content ?? '');
            const parts = raw.split(/<!--\s*pagebreak\s*-->/gi);
            return {
                intro: parts[0] || '',
                rest: parts.slice(1).join('\n\n<!-- pagebreak -->\n\n'),
            };
        }

        let allPosts = [];

        function updateCategoryFilter(posts) {
            const filter = document.getElementById('categoryFilter');
            const categories = [...new Set(posts.map(p => p.category || 'Umum'))].sort();
            if (categories.length === 0) {
                filter.classList.add('hidden');
                return;
            }
            const current = filter.value;
            filter.innerHTML =
                '<option value="">Semua kategori</option>' +
                categories.map(c => `<option value="${escapeHtml(c)}"${c === current ? ' selected' : ''}>${escapeHtml(c)}</option>`).join('');
            filter.classList.remove('hidden');
        }

        function renderPosts(posts) {
            if (posts.length === 0) {
                postsList.innerHTML = `
                    <div class="bg-white rounded-xl border border-dashed border-gray-300 p-10 text-center">
                        <p class="text-gray-500">${allPosts.length === 0 ? 'Belum ada konten yang diterbitkan.' : 'Tidak ada konten pada kategori ini.'}</p>
                        ${allPosts.length === 0 ? '<a href="/admin" class="inline-block mt-4 text-sm text-blue-600 font-semibold hover:underline">Tambahkan konten lewat dashboard admin &rarr;</a>' : ''}
                    </div>`;
                return;
            }

            postsList.innerHTML = posts.map(post => {
                const { intro, rest } = splitByPageBreak(post.content);
                const introHtml = renderContentBlock(intro);
                const restHtml = rest ? `<div id="read-more-${post.id}" class="read-more-content hidden">${renderContentBlock(rest)}</div>` : '';
                const toggleBtn = rest
                    ? `<button type="button" class="read-more-toggle" data-post-id="${post.id}">Lanjutkan membaca</button>`
                    : '';

                return `
                    <article class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition" data-post-id="${post.id}">
                        ${post.image || post.thumbnail ? `<img src="${post.image || post.thumbnail}" alt="${post.title}" class="w-full h-56 object-cover border-b border-gray-200">` : ''}
                        <div class="p-6">
                            <h3 class="text-xl font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                            <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-400">
                                <span class="bg-indigo-100 text-indigo-700 px-2 py-0.5 rounded-full font-semibold">${escapeHtml(post.category || 'Umum')}</span>
                                <span class="inline-flex items-center gap-1">
                                    <span class="bg-gray-100 text-gray-600 rounded-full w-5 h-5 inline-flex items-center justify-center font-bold">${escapeHtml((post.author || 'A').charAt(0).toUpperCase())}</span>
                                    ${escapeHtml(post.author || 'Admin')}
                                </span>
                                <span>${escapeHtml(formatDate(post.createdAt))}</span>
                            </div>
                            <div class="mt-4 text-gray-600 whitespace-pre-line break-words">
                                ${introHtml ? introHtml : '<span class="text-gray-400">Konten tidak tersedia.</span>'}
                                ${restHtml}
                                ${toggleBtn}
                            </div>
                        </div>
                    </article>
                `;
            }).join('');
        }

        postsList.addEventListener('click', (event) => {
            const button = event.target.closest('.read-more-toggle');
            if (!button) return;
            const postId = button.dataset.postId;
            const content = document.getElementById(`read-more-${postId}`);
            if (!content) return;
            const isHidden = content.classList.contains('hidden');
            content.classList.toggle('hidden', !isHidden);
            button.textContent = isHidden ? 'Sembunyikan' : 'Lanjutkan membaca';
        });

        document.getElementById('categoryFilter').addEventListener('change', (e) => {
            const filter = e.target.value;
            renderPosts(filter ? allPosts.filter(p => (p.category || 'Umum') === filter) : allPosts);
        });

        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts', { headers: { Accept: 'application/json' } });
                if (response.status === 503) {
                    postsList.innerHTML = '';
                    showStatus('error', 'Konten belum tersedia: konfigurasi Firebase (Firestore) di server belum diatur oleh admin.');
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const posts = await response.json();
                allPosts = posts;
                document.getElementById('postCount').textContent = posts.length;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleString('id-ID');
                updateCategoryFilter(posts);
                renderPosts(posts);
            } catch (error) {
                console.error('Gagal memuat post:', error);
                postsList.innerHTML = '';
                showStatus('error', 'Gagal memuat konten. Silakan coba lagi beberapa saat lagi.');
            }
        }

        const heroTitleEl = document.getElementById('heroTitle');
        const heroSubtitleEl = document.getElementById('heroSubtitle');
        const HERO_DEFAULT = {
            title: heroTitleEl.textContent.trim(),
            subtitle: heroSubtitleEl.textContent.trim(),
        };
        let heroRendered = { title: '', subtitle: '' };
        let typewriterTimer = null;
        let typewriterToken = 0;

        function prefersReducedMotion() {
            return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        }

        function animateHero(title, subtitle) {
            if (heroRendered.title === title && heroRendered.subtitle === subtitle) return;
            heroRendered = { title, subtitle };

            heroTitleEl.innerHTML =
                title
                    .split(/\s+/)
                    .filter(Boolean)
                    .map((word, i) => `<span class="hero-word" style="animation-delay:${Math.min(i * 70, 700)}ms">${escapeHtml(word)}</span>`)
                    .join(' ') || '&nbsp;';

            heroSubtitleEl.setAttribute('aria-label', subtitle);
            typewriterToken += 1;
            const token = typewriterToken;
            if (typewriterTimer) {
                clearInterval(typewriterTimer);
                typewriterTimer = null;
            }

            if (prefersReducedMotion()) {
                heroSubtitleEl.textContent = subtitle;
                return;
            }

            heroSubtitleEl.innerHTML =
                '<span id="heroTyped"></span><span class="hero-cursor" aria-hidden="true">&nbsp;</span>';
            const typedEl = document.getElementById('heroTyped');
            let i = 0;
            typewriterTimer = setInterval(() => {
                if (token !== typewriterToken) {
                    clearInterval(typewriterTimer);
                    return;
                }
                i += 1;
                typedEl.textContent = subtitle.slice(0, i);
                if (i >= subtitle.length) {
                    clearInterval(typewriterTimer);
                    typewriterTimer = null;
                }
            }, 22);
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/settings', { headers: { Accept: 'application/json' } });
                if (!response.ok) return;
                const settings = await response.json();
                const hero = settings.hero || {};
                animateHero(hero.title || HERO_DEFAULT.title, hero.subtitle || HERO_DEFAULT.subtitle);
                if (hero.image) {
                    const bg = document.getElementById('heroBg');
                    bg.style.backgroundImage = 'url(' + JSON.stringify(hero.image) + ')';
                    bg.classList.remove('hidden');
                    document.getElementById('heroOverlay').classList.remove('hidden');
                    const subtitle = document.getElementById('heroSubtitle');
                    subtitle.classList.remove('text-blue-100');
                    subtitle.classList.add('text-gray-100');
                }
            } catch (error) {
                // biarkan tampilan bawaan bila pengaturan gagal dimuat
            }
        }

        animateHero(HERO_DEFAULT.title, HERO_DEFAULT.subtitle);
        loadSettings();
        fetchPosts();
    </script>
</body>
</html>
