<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beranda | Node.js CMS</title>
    <meta name="description" content="Homepage publik dari Node.js CMS berbasis Firestore">
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans leading-relaxed tracking-normal text-gray-800">

    <!-- Header -->
    <header class="bg-white/90 backdrop-blur border-b border-gray-200 sticky top-0 z-10">
        <div class="container mx-auto px-6 py-4 max-w-4xl flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="bg-blue-600 text-white font-bold rounded-lg w-9 h-9 flex items-center justify-center">C</span>
                <span class="text-lg font-bold text-gray-800">CMS Publik</span>
            </a>
            <nav class="flex items-center gap-4 text-sm">
                <a href="/" class="text-blue-600 font-semibold">Beranda</a>
                <a href="/admin" class="bg-gray-800 hover:bg-gray-900 text-white px-4 py-2 rounded-lg transition">Masuk Admin</a>
            </nav>
        </div>
    </header>

    <!-- Hero -->
    <section class="bg-gradient-to-br from-blue-700 via-blue-600 to-indigo-700 text-white">
        <div class="container mx-auto px-6 py-16 max-w-4xl">
            <h1 class="text-4xl md:text-5xl font-bold leading-tight">Selamat Datang di CMS Kami</h1>
            <p class="mt-4 text-blue-100 text-lg max-w-2xl">
                Baca semua konten yang sudah diterbitkan oleh tim admin. Konten diperbarui secara langsung dari Firestore.
            </p>
            <div class="mt-6 flex items-center gap-6 text-sm text-blue-100">
                <span><span id="postCount" class="text-white font-bold text-xl">–</span> konten terbit</span>
                <span class="hidden sm:inline">Diperbarui: <span id="lastUpdated">–</span></span>
            </div>
        </div>
    </section>

    <!-- Daftar Konten Publik -->
    <main class="container mx-auto px-6 py-10 max-w-4xl">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Konten Terbaru</h2>

        <div id="statusBox" class="hidden mb-6 rounded-lg border px-4 py-3 text-sm"></div>

        <div id="postsList" class="space-y-6">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            </div>
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/3 mb-3"></div>
                <div class="h-3 bg-gray-200 rounded w-full mb-2"></div>
                <div class="h-3 bg-gray-200 rounded w-2/3"></div>
            </div>
        </div>
    </main>

    <footer class="border-t border-gray-200 bg-white">
        <div class="container mx-auto px-6 py-6 max-w-4xl text-sm text-gray-500 flex flex-col sm:flex-row items-center justify-between gap-2">
            <p>&copy; <span id="year"></span> Node.js CMS &middot; Firestore</p>
            <p>Punya konten untuk diterbitkan? <a href="/admin" class="text-blue-600 font-semibold hover:underline">Masuk dashboard admin</a></p>
        </div>
    </footer>

    <script>
        const postsList = document.getElementById('postsList');
        const statusBox = document.getElementById('statusBox');
        document.getElementById('year').textContent = new Date().getFullYear();

        // Helper untuk mencegah XSS dasar
        function escapeHtml(text) {
            return String(text ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatDate(value) {
            const date = new Date(value);
            return isNaN(date) ? '–' : date.toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
        }

        function showStatus(type, message) {
            const styles = {
                info: 'bg-blue-50 border-blue-200 text-blue-700',
                error: 'bg-red-50 border-red-200 text-red-700',
            };
            statusBox.className = `mb-6 rounded-lg border px-4 py-3 text-sm ${styles[type] || styles.info}`;
            statusBox.textContent = message;
            statusBox.classList.remove('hidden');
        }

        async function fetchPosts() {
            try {
                const response = await fetch('/api/posts', { headers: { Accept: 'application/json' } });

                if (response.status === 503) {
                    postsList.innerHTML = '';
                    showStatus('error', 'Konten belum tersedia: konfigurasi Firebase (Firestore) di server belum diatur oleh admin.');
                    return;
                }
                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                const posts = await response.json();
                document.getElementById('postCount').textContent = posts.length;
                document.getElementById('lastUpdated').textContent = new Date().toLocaleString('id-ID');

                if (posts.length === 0) {
                    postsList.innerHTML = `
                        <div class="bg-white rounded-xl border border-dashed border-gray-300 p-10 text-center">
                            <p class="text-gray-500">Belum ada konten yang diterbitkan.</p>
                            <a href="/admin" class="inline-block mt-4 text-sm text-blue-600 font-semibold hover:underline">Tambahkan konten lewat dashboard admin &rarr;</a>
                        </div>`;
                    return;
                }

                postsList.innerHTML = posts.map(post => `
                    <article class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 hover:shadow-md transition">
                        <h3 class="text-xl font-bold text-gray-800">${escapeHtml(post.title)}</h3>
                        <div class="mt-2 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-gray-400">
                            <span class="inline-flex items-center gap-1">
                                <span class="bg-gray-100 text-gray-600 rounded-full w-5 h-5 inline-flex items-center justify-center font-bold">${escapeHtml((post.author || 'A').charAt(0).toUpperCase())}</span>
                                ${escapeHtml(post.author || 'Admin')}
                            </span>
                            <span>${escapeHtml(formatDate(post.createdAt))}</span>
                        </div>
                        <p class="mt-4 text-gray-600 whitespace-pre-line break-words">${escapeHtml(post.content)}</p>
                    </article>
                `).join('');
            } catch (error) {
                console.error('Gagal memuat post:', error);
                postsList.innerHTML = '';
                showStatus('error', 'Gagal memuat konten. Silakan coba lagi beberapa saat lagi.');
            }
        }

        fetchPosts();
    </script>
</body>
</html>
